name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'README*'

# One deploy at a time: two overlapping runs would stop/pull/restore the same
# SQLite file and worktree. A newer push waits (and replaces an older waiting
# run); a running deploy is never cancelled mid-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
        set -e
        cd ~/projects/mrCarpet
        mkdir -p backups
        TS=$(date +%Y%m%d_%H%M%S)

        # --- Housekeeping ПЕРЕД деплоєм ---------------------------------
        # Свідомо на початку, а не в кінці: якщо деплой упаде на healthcheck,
        # прибирання все одно відбудеться. Саме через "очищення в кінці"
        # одного разу набігло 44 ГБ build cache і диск заповнився на 76%.
        echo "Housekeeping: rotating DB backups (keep 10 newest + oldest anchor)..."
        # subshell: жоден збій усередині не змінить робочу директорію деплою
        (
          cd backups || exit 0
          OLDEST=$(ls -1t db.sqlite3.* 2>/dev/null | tail -1)
          ls -1t db.sqlite3.* 2>/dev/null | tail -n +11 \
            | grep -v "^${OLDEST}$" | xargs -r rm -f
        ) || true
        # /tmp-копії БД належать root (їх пише alpine-контейнер) — чистимо ним же
        docker run --rm -v /tmp:/hosttmp alpine:latest sh -c \
          'cd /hosttmp && ls -1t mrcarpet_db_live_*.sqlite3 2>/dev/null | tail -n +4 | xargs -r rm -f; rm -rf mrcarpet_next.*' \
          || true
        echo "Housekeeping: pruning docker build cache older than 48h..."
        docker builder prune -f --filter until=48h || true
        df -h / | tail -1

        # IMPORTANT: SQLite lives inside the git worktree (bind mount).
        # Never let git pull overwrite db.sqlite3 / WAL / SHM.

        # The site is down from `stop web` until gunicorn answers again, so
        # everything that does not need web stopped runs BEFORE it: fetch,
        # nginx -t of the incoming config, the image build, the list of
        # untracked files that would block the merge. Only the DB backup, the
        # pull and the DB restore stay inside the window.
        WORK_DIR=$(mktemp -d /tmp/mrcarpet_next.XXXXXX)
        NEXT_DIR="$WORK_DIR/src"
        WEB_STOPPED=0
        WEB_STARTED=0
        on_exit() {
          rc=$?
          # A failure inside the window (pull refused, cp failed...) used to
          # leave web stopped until someone noticed. Bring the stack back on
          # whatever code is on disk; the DB is untouched or atomically
          # restored, see below.
          if [ "$WEB_STOPPED" = "1" ] && [ "$WEB_STARTED" = "0" ]; then
            echo "Deploy aborted while web was stopped: starting web and daemons again..."
            docker compose -f docker-compose.prod.yml up -d web ga4-weekly content-scheduler rozetka-poller </dev/null || true
          fi
          rm -rf "$WORK_DIR" 2>/dev/null || true
          exit $rc
        }
        trap on_exit EXIT

        OLD_HEAD=$(git rev-parse HEAD)
        echo "Fetching origin (site still up)..."
        git fetch origin
        NEW_HEAD=$(git rev-parse origin/main)
        echo "Deploying $OLD_HEAD -> $NEW_HEAD"
        mkdir -p "$NEXT_DIR"
        git archive -o "$WORK_DIR/next.tar" "$NEW_HEAD"
        tar -xf "$WORK_DIR/next.tar" -C "$NEXT_DIR"

        # nginx reads config/mrcarpet.docker and config/nginx-main.conf through
        # single-file bind mounts. git pull writes each file as a new inode and a
        # running container keeps the old one, so `nginx -s reload` kept loading
        # the stale file and repo changes never went live. Check the incoming
        # files here, in a throwaway container with the same image and the same
        # mounts as the compose nginx service (no ports published; a test keeps
        # the two lists in sync), before any `up` below gets a chance to
        # recreate nginx. stdin from /dev/null: this script is ssh's stdin.
        echo "Validating nginx config of the incoming commit (nginx -t, site still up)..."
        NGINX_CONFIG_OK=0
        if docker run --rm \
          -v "$NEXT_DIR/config/nginx-main.conf:/etc/nginx/nginx.conf:ro" \
          -v "$NEXT_DIR/config/mrcarpet.docker:/etc/nginx/conf.d/default.conf:ro" \
          -v "$PWD/config/certbot:/etc/letsencrypt:ro" \
          -v "$PWD/config/certbot-www:/var/www/certbot:ro" \
          -v "$NEXT_DIR/config/maintenance:/usr/share/nginx/maintenance:ro" \
          nginx:latest nginx -t </dev/null; then
          NGINX_CONFIG_OK=1
          echo "nginx config OK"
        else
          echo "ERROR: nginx -t failed on the incoming config. The running nginx is left as it is."
        fi

        # Code is bind-mounted (.:/app), so the image only carries the OS
        # packages and Python deps. Rebuilding it on every deploy reinstalled
        # all of pip from scratch (the build cache is pruned after 48h) and kept
        # the site down for ~7 minutes. Rebuild only when the image inputs
        # changed, or when the image is missing, and do it from a clean export
        # of the incoming commit while the old containers keep serving. A
        # failed build stops the deploy here, with the site still up.
        IMAGE_FILES="Dockerfile.prod requirements.txt requirements-ga4.txt"
        IMAGE_INPUTS=$(git diff --name-only "$OLD_HEAD" "$NEW_HEAD" -- $IMAGE_FILES || echo "unknown")
        if [ -n "$IMAGE_INPUTS" ] || ! docker image inspect mrcarpet-web:latest >/dev/null 2>&1; then
          echo "Building images from the incoming commit, site still up (changed: ${IMAGE_INPUTS:-image missing})..."
          # same compose project and .env, only the build context is swapped
          printf 'services:\n  web:\n    build:\n      context: %s\n  tiktok-daily:\n    build:\n      context: %s\n' \
            "$NEXT_DIR" "$NEXT_DIR" > "$WORK_DIR/build-override.yml"
          docker compose -f docker-compose.prod.yml -f "$WORK_DIR/build-override.yml" build web tiktok-daily </dev/null
        else
          echo "Image inputs unchanged; skipping rebuild (code comes from the bind mount)."
        fi

        # scp/manual leftovers: untracked files that already exist in the
        # incoming tree block `git pull` ("would be overwritten by merge").
        # List them now (one comm instead of a git call per file: ~1900 git
        # processes used to run inside the window); remove them after stop.
        git -c core.quotePath=false ls-tree -r --name-only "$NEW_HEAD" | LC_ALL=C sort > "$WORK_DIR/next.txt"
        git -c core.quotePath=false ls-files | LC_ALL=C sort > "$WORK_DIR/tracked.txt"
        LC_ALL=C comm -23 "$WORK_DIR/next.txt" "$WORK_DIR/tracked.txt" > "$WORK_DIR/blockers.txt"

        # ---------------- site is down from here -----------------------------
        # The daemons write the same SQLite file (Rozetka orders, social post
        # status, weekly report). A write that lands after the snapshot below
        # would be wiped by the restore after pull, so they stop too, in
        # parallel with web; they are started again right after web.
        echo "Stopping web and the DB-writing daemons for backup + git pull..."
        WEB_STOPPED=1
        for svc in ga4-weekly content-scheduler rozetka-poller; do
          docker compose -f docker-compose.prod.yml stop "$svc" </dev/null &
        done
        docker compose -f docker-compose.prod.yml stop web || true
        wait || true

        echo "Checkpointing WAL into db.sqlite3, then backing up..."
        CHECKPOINT_OK=0
        if [ -f db.sqlite3 ]; then
          if command -v sqlite3 >/dev/null 2>&1; then
            # prints busy|log|checkpointed; busy=0 means everything is in db.sqlite3
            case "$(sqlite3 db.sqlite3 "PRAGMA wal_checkpoint(TRUNCATE);" 2>&1)" in
              0\|*) CHECKPOINT_OK=1 ;;
            esac
          else
            # -T and </dev/null: compose run would otherwise read the rest of
            # this script (it is the ssh session's stdin) as its own input
            docker compose -f docker-compose.prod.yml run --rm --no-deps -T web \
              python -c "import sqlite3; c=sqlite3.connect('/app/db.sqlite3'); r=c.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone(); c.close(); raise SystemExit(r[0])" \
              </dev/null && CHECKPOINT_OK=1 || true
          fi
          if [ "$CHECKPOINT_OK" = "1" ]; then
            docker run --rm -v "$PWD":/app -v /tmp:/tmp alpine:latest \
              sh -c "cp /app/db.sqlite3 /app/backups/db.sqlite3.pre_deploy_${TS} && cp /app/db.sqlite3 /tmp/mrcarpet_db_live_${TS}.sqlite3 && chmod 644 /app/backups/db.sqlite3.pre_deploy_${TS} /tmp/mrcarpet_db_live_${TS}.sqlite3"
          else
            # Part of the data may still sit in the WAL: keep it next to the
            # backup and do NOT restore over the live files after pull
            # (restoring db.sqlite3 alone and deleting the WAL would lose it).
            echo "WARNING: WAL checkpoint incomplete; backing up db + WAL, live DB will not be restored"
            docker run --rm -v "$PWD":/app alpine:latest \
              sh -c "cp /app/db.sqlite3 /app/backups/db.sqlite3.pre_deploy_${TS} && if [ -f /app/db.sqlite3-wal ]; then cp /app/db.sqlite3-wal /app/backups/db.sqlite3.pre_deploy_${TS}-wal; fi && chmod 644 /app/backups/db.sqlite3.pre_deploy_${TS}*"
          fi
        fi

        echo "Resetting tracked worktree drift so git pull cannot abort..."
        # DB/backups are untracked — safe. Never commit them.
        git checkout -- . || true
        git clean -fd -- scripts || true

        echo "Clearing untracked paths that would block merge from origin/main..."
        while IFS= read -r path; do
          [ -e "$path" ] || continue
          case "$path" in
            db.sqlite3|db.sqlite3-wal|db.sqlite3-shm) continue ;;
          esac
          rm -rf -- "$path"
        done < "$WORK_DIR/blockers.txt"

        echo "Pulling latest changes..."
        git pull origin main

        echo "Restoring live SQLite (git must not own prod data)..."
        if [ -f "/tmp/mrcarpet_db_live_${TS}.sqlite3" ]; then
          # copy beside, then rename: a failed copy can never leave a
          # half-written db.sqlite3 behind
          docker run --rm -v "$PWD":/app -v /tmp:/tmp alpine:latest \
            sh -c "cp /tmp/mrcarpet_db_live_${TS}.sqlite3 /app/.db_restore_tmp && chmod 666 /app/.db_restore_tmp && mv -f /app/.db_restore_tmp /app/db.sqlite3 && rm -f /app/db.sqlite3-wal /app/db.sqlite3-shm"
        elif [ ! -f db.sqlite3 ]; then
          # no DB at all: drop orphan sidecars (never when a WAL may hold data)
          rm -f db.sqlite3-wal db.sqlite3-shm
        fi

        # Normally HEAD == NEW_HEAD. If a newer push landed between fetch and
        # pull, or this run's compose file differs from the one on disk,
        # re-check what was actually pulled with the real compose mounts.
        PULLED_HEAD=$(git rev-parse HEAD)
        if [ "$PULLED_HEAD" != "$NEW_HEAD" ] || ! git diff --quiet "$OLD_HEAD" "$PULLED_HEAD" -- docker-compose.prod.yml; then
          echo "Re-validating nginx against the pulled compose file..."
          NGINX_CONFIG_OK=0
          if docker compose -f docker-compose.prod.yml run --rm --no-deps -T nginx nginx -t </dev/null; then
            NGINX_CONFIG_OK=1
            echo "nginx config OK"
          else
            echo "ERROR: nginx -t failed on the pulled config. The running nginx is left as it is."
          fi
        fi
        if [ "$PULLED_HEAD" != "$NEW_HEAD" ] && [ -n "$(git diff --name-only "$NEW_HEAD" "$PULLED_HEAD" -- $IMAGE_FILES)" ]; then
          echo "Pulled past the pre-built commit with new image inputs: rebuilding in place..."
          docker compose -f docker-compose.prod.yml build web tiktok-daily </dev/null
        fi

        echo "Starting web first..."
        docker compose -f docker-compose.prod.yml up -d web
        WEB_STARTED=1

        # Фонові сервіси піднімаємо ДО healthcheck: якщо перевірка нижче
        # впаде і скрипт вийде з exit 1, планувальник тижневого звіту
        # (ga4-weekly) все одно лишиться живим. Саме через зворотний
        # порядок він одного разу зник і звіт у понеділок не прийшов.
        echo "Starting background services (independent of healthcheck)..."
        docker compose -f docker-compose.prod.yml up -d ga4-weekly content-scheduler rozetka-poller
        # The daemons take their Python code from the bind mount, so a plain
        # restart picks up new code; only Dockerfile changes need the rebuild
        # above. Naming them explicitly means a brand-new service starts on the
        # deploy that introduces it, instead of waiting to be noticed.
        # tiktok-daily is paused and excluded by its opt-in compose profile.

        echo "Waiting until gunicorn answers inside web..."
        # Host header обов'язковий: ALLOWED_HOSTS строгий, голий 127.0.0.1 дав би 400
        # up to ~6 min: web runs `migrate` before gunicorn, and a big content
        # migration (100 articles + carousel slides) took ~90 s on 24.11.2026
        for i in $(seq 1 360); do
          if docker compose -f docker-compose.prod.yml exec -T web \
            python -c "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/', headers={'Host': 'mrcarpet24.com'}), timeout=2)" \
            </dev/null >/dev/null 2>&1; then
            echo "web ready (attempt $i)"
            break
          fi
          sleep 1
          if [ "$i" -eq 360 ]; then
            echo "web failed to become ready"
            docker compose -f docker-compose.prod.yml logs web --tail 80
            exit 1
          fi
        done

        echo "Starting remaining services..."
        if [ "$NGINX_CONFIG_OK" = "1" ]; then
          docker compose -f docker-compose.prod.yml up -d
        else
          # never let compose recreate nginx onto a config that failed nginx -t
          docker compose -f docker-compose.prod.yml up -d --no-recreate
        fi

        echo "Collecting static files..."
        docker compose -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput </dev/null || true
        # thumbnails made before the 0644 fix were 0600 -> nginx 403; make all readable
        docker compose -f docker-compose.prod.yml exec -T web sh -c 'chmod -R a+rX /app/media/thumbs 2>/dev/null' </dev/null || true

        echo "Running migrations..."
        docker compose -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput </dev/null || true
        # rozetka-poller imports its Python once at start: restart it after
        # migrate so new code (and new tables) are picked up on every deploy
        docker compose -f docker-compose.prod.yml restart rozetka-poller </dev/null || true

        echo "Applying nginx config..."
        if [ "$NGINX_CONFIG_OK" = "1" ]; then
          # Recreate, not reload: only a new container sees the new inodes.
          # Costs about a second of refused connections.
          docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate nginx
        else
          echo "ERROR: nginx not recreated, its config failed nginx -t (see above)."
        fi

        echo "Healthcheck via public HTTPS (must be 200)..."
        OK=0
        for i in $(seq 1 12); do
          CODE=$(python3 -c 'import urllib.request; print(urllib.request.urlopen("https://mrcarpet24.com/", timeout=10).status)' 2>/dev/null || echo 000)
          echo "health attempt $i -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            OK=1
            break
          fi
          # a restart remounts the files from disk, so never do it onto a
          # config that failed nginx -t: that would take the site down
          if [ "$NGINX_CONFIG_OK" = "1" ]; then
            docker compose -f docker-compose.prod.yml restart nginx
          fi
          sleep 3
        done
        if [ "$OK" != "1" ]; then
          echo "Deploy healthcheck failed - site not returning 200"
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs web --tail 50
          docker compose -f docker-compose.prod.yml logs nginx --tail 50
          exit 1
        fi

        echo "nginx headers (informational): one Cache-Control on bundles, favicon 200"
        python3 -c 'import urllib.request as u; r=u.urlopen(u.Request("https://mrcarpet24.com/static/source/pages/index/index.js", method="HEAD"), timeout=10); print("bundle Cache-Control:", r.headers.get_all("Cache-Control")); r=u.urlopen(u.Request("https://mrcarpet24.com/favicon.ico", method="HEAD"), timeout=10); print("favicon.ico:", r.status, r.headers.get("Content-Type"))' \
          || echo "header check failed (non-fatal)"

        echo "Final state:"
        docker compose -f docker-compose.prod.yml ps

        echo "Cleaning up Docker images..."
        # ВАЖЛИВО: тільки образи. `docker system prune` видаляє ще й зупинені
        # контейнери — так одного разу зник ga4-weekly і тижневий звіт не прийшов.
        # Build cache чиститься на початку деплою (див. Housekeeping).
        docker image prune -f
        df -h / | tail -1

        if [ "$NGINX_CONFIG_OK" != "1" ]; then
          echo "Deploy is live, but nginx still runs its OLD config: nginx -t failed on config/. Fix it and push again."
          exit 1
        fi

        echo "Deployment completed successfully!"
        EOF

    - name: Deployment status
      run: echo "Deployment completed successfully!"
